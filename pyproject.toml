[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrdraft"
version = "0.1.0"
description = "Speculative-decoding overhead study and drafter training for LightOnOCR-2-1B"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nyamkhuu Demberelsuren" }]
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "matplotlib>=3.10,<4",
  "pypdfium2>=4.30",
  "pillow>=11",
  "huggingface_hub>=0.34",
  "prometheus-client>=0.21,<1",
]

[project.urls]
Repository = "https://github.com/d-nyamkhuu/lightonocr-speculative-decoding"

[project.scripts]
ocrdraft = "ocrdraft.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
# The README's code blocks are hand-formatted for reading.
exclude = ["*.md"]
